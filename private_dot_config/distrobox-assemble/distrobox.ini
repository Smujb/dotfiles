[Fedora]
additional_packages="zsh fastfetch just"
image=quay.io/fedora/fedora-toolbox:latest
hostname=fedorabox
pull=true
init_hooks="chsh $USER -s $(which zsh)"

[Arch]
additional_packages="git base-devel zsh fastfetch just"
image=docker.io/library/archlinux:latest
hostname=archbox
pull=true
init_hooks="chsh $USER -s $(which zsh)"

[Debian]
additional_packages="zsh fastfetch just"
image=ghcr.io/ublue-os/debian-toolbox:latest
hostname=debianbox
pull=true
init_hooks="chsh $USER -s $(which zsh)"
