[Fedora]
additional_packages="zsh fastfetch"
image=quay.io/fedora/fedora-toolbox:latest
hostname=fedorabox
init_hooks="chsh $USER -s $(which zsh)"

[Arch]
additional_packages="git base-devel zsh fastfetch"
image=docker.io/library/archlinux:latest
hostname=archbox
init_hooks="chsh $USER -s $(which zsh)"

[Debian]
additional_packages="zsh fastfetch"
image=ghcr.io/ublue-os/debian-toolbox:latest
hostname=debianbox
init_hooks="chsh $USER -s $(which zsh)"
